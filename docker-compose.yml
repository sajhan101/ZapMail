services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zapmail-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
      - "2525:2525"
    env_file:
      - ./backend/.env
    environment:
      - PORT=5000
      - SMTP_PORT=2525
      - DATABASE_PATH=/app/data/zapmail.sqlite
    volumes:
      - zapmail_data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zapmail-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  zapmail_data:
